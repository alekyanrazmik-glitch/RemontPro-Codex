<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Редактирование проекта</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <a class="logo" href="../index.html">Remont<span>Pro</span></a>
        <p class="small">Демо-админка на localStorage</p>
        <a href="index.html">Dashboard</a><a href="portfolio.html">Проекты</a
        ><a href="project-edit.html">Добавить проект</a
        ><a href="videos.html">Видео</a>
      </aside>
      <main class="admin-main">
        <h1>Проект</h1>
        <form id="projectForm" class="form">
          <label>ID<input name="id" /></label
          ><label>Название<input name="title" /></label
          ><label>Город<input name="city" /></label
          ><label>Площадь<input name="area" /></label
          ><label>Тип ремонта<input name="type" /></label
          ><label>Срок<input name="duration" /></label
          ><label>Бюджет<input name="budget" /></label
          ><label>Статус<input name="status" /></label
          ><label>Главное изображение<input name="cover" /></label
          ><label>YouTube<input name="youtubeUrl" /></label
          ><label>До<input name="before" /></label
          ><label>После<input name="after" /></label
          ><label>Описание<textarea name="description"></textarea></label
          ><label>Задача<textarea name="task"></textarea></label
          ><label
            >Галерея, по одной ссылке в строке<textarea
              name="gallery"
            ></textarea></label
          ><label
            >Что сделали, по строкам<textarea name="done"></textarea></label
          ><button class="btn btn--accent">Сохранить</button>
        </form>
      </main>
    </div>
    <script src="../assets/js/admin.js"></script>
  </body>
</html>
